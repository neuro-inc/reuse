---
# Release Service workflow.
# Detects service version based on tags and commit history. If commit has no tag
# workflow generates prerelease version.
# Publishes Apolo service as ghcr.io Docker image and Helm Chart,
# Creates GitHub release with linked issues and pull requests

on:
  workflow_call:
    inputs:
      image:
        description: short image name without repo/owner and tag, e.g. platformstorageapi
        required: false
        type: string
      helm_charts:
        description: A list of helm charts separated by space, comma, or newline
        required: true
        type: string
      helm_chart_repo_prefix:
        description: The helm chart repository prefix
        required: false
        default: ''
        type: string
      artifact:
        description: The artifact name uploaded by upload-image-action
        required: false
        default: image
        type: string
    outputs:
      version:
        description: Version
        value: ${{ jobs.release.outputs.version }}
      prerelease:
        description: Prerelease
        value: ${{ jobs.release.outputs.prerelease }}

permissions:
#  actions: write  # for artifact removal
  contents: write  # for release creation
  packages: write  # for publishing on ghcr.io

jobs:
  release:
    name: Release image and helm chart
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
    - name: Checkout commit
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Detect metadata
      id: meta
      run: |
        import os
        import re
        from datetime import datetime, timezone

        ref = os.environ["GITHUB_REF"]
        tag = ref.removeprefix("refs/tags/") if ref.startswith("refs/tags/") else ""
        if tag:
            match = re.fullmatch(r"v\d+\.\d+(?:\.\d+)?(?P<pre>-(?:a|b|rc|dev)\.\d+)?", tag)
            if not match:
                raise ValueError("Release tags must use vYY.MM.N[-dev.N] format.")
            version = tag[1:]
            prerelease = bool(match.group("pre"))
        else:
            now = datetime.now(timezone.utc)
            version = f"{now.year % 100}.{now.month}.0-dev.{int(os.environ['GITHUB_RUN_ID'])}"
            prerelease = True
        print("Detected version:", version)
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print(f"tag={tag}", file=output)
            print(f"version={version}", file=output)
            print(f"prerelease={'true' if prerelease else ''}", file=output)
      shell: python
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0
    - name: Login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Reject existing release versions
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        IMAGE: ${{ inputs.image }}
        CHARTS: ${{ inputs.helm_charts }}
        CHART_PREFIX: ${{ inputs.helm_chart_repo_prefix }}
      shell: python
      run: |
        import os
        import subprocess

        version = os.environ["VERSION"]
        commands = []
        if os.environ["IMAGE"]:
            commands.append(["docker", "buildx", "imagetools", "inspect", f"ghcr.io/neuro-inc/{os.environ['IMAGE']}:{version}"])
        for chart in os.environ["CHARTS"].replace(",", " ").split():
            commands.append(["helm", "show", "chart", f"oci://ghcr.io/neuro-inc/helm-charts{os.environ['CHART_PREFIX']}/{chart}", "--version", version])
        for command in commands:
            result = subprocess.run(command, capture_output=True, text=True)
            if result.returncode == 0:
                raise RuntimeError(f"Version {version} already exists; published versions are immutable.")
            error = (result.stdout + result.stderr).lower()
            if any(word in error for word in ("unauthorized", "denied", "forbidden", "authorization")):
                raise RuntimeError("Cannot verify release absence: registry access failed.")
            if not any(word in error for word in ("manifest unknown", "not found", "404")):
                raise RuntimeError("Cannot verify release absence: registry lookup failed.")
    # - name: Purge old artifacts
    #   uses: kolpav/purge-artifacts-action@v1
    #   with:
    #     token: ${{ github.token }}
    #     expire-in: 30mins
    - name: Download image artifact
      if: inputs.image != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
    - name: Load image into docker
      if: inputs.image != ''
      run: |
        docker load --input ${{ inputs.image }}.tar
      shell: bash
    - name: Tag remote latest image
      if: inputs.image != ''
      run: |
        docker tag ${{ inputs.image }}:latest ghcr.io/neuro-inc/${{ inputs.image }}:latest
      shell: bash
    - name: Tag remote versioned image
      if: inputs.image != ''
      run: |
        docker tag ${{ inputs.image }}:latest ghcr.io/neuro-inc/${{ inputs.image }}:${{ steps.meta.outputs.version }}
      shell: bash
    - name: Push latest image to ghcr.io
      if: inputs.image != ''
      run: |
        docker push ghcr.io/neuro-inc/${{ inputs.image }}:latest
      shell: bash
    - name: Push versioned image to ghcr.io
      if: inputs.image != ''
      run: |
        docker push ghcr.io/neuro-inc/${{ inputs.image }}:${{ steps.meta.outputs.version }}
      shell: bash
    - name: Create chart
      run: |
        CHARTS=$(printf '%s\n' "$CHARTS" | tr $',\n' ' ' | xargs)
        for HELM_CHART in $CHARTS; do
          VALUES=$(cat charts/${HELM_CHART}/values.yaml | envsubst)
          echo "$VALUES" > charts/${HELM_CHART}/values.yaml
        done
      env:
        CHARTS: ${{ inputs.helm_charts }}
        # envs are used by envsubst above
        IMAGE_REPO: ghcr.io/neuro-inc/${{ inputs.image }}
        IMAGE_TAG: ${{ steps.meta.outputs.version }}
      shell: bash
    - name: Release chart
      run: |
        echo $CR_TOKEN | helm registry login ghcr.io -u x-access-token --password-stdin
        CHARTS=$(printf '%s\n' "$CHARTS" | tr $',\n' ' ' | xargs)
        for HELM_CHART in $CHARTS; do
          helm package charts/${HELM_CHART} -u --version ${{ steps.meta.outputs.version }} --app-version ${{ steps.meta.outputs.version }}
          helm push ${HELM_CHART}-${{ steps.meta.outputs.version }}.tgz oci://ghcr.io/neuro-inc/helm-charts${{ inputs.helm_chart_repo_prefix }}
        done
      env:
        CHARTS: ${{ inputs.helm_charts }}
        CR_TOKEN: ${{ github.token }}
      shell: bash
    - name: GitHub Release
      uses: ncipollo/release-action@v1.9.0
      if: steps.meta.outputs.prerelease != 'true'
      with:
        name: ${{ steps.meta.outputs.version }}
        prerelease: ${{ steps.meta.outputs.prerelease }}
        generateReleaseNotes: 'true'
        tag: ${{ steps.meta.outputs.tag }}
        token: ${{ github.token }}
